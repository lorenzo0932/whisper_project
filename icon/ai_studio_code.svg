<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfondo Dark Mode -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232731"/>
      <stop offset="100%" stop-color="#14161C"/>
    </linearGradient>

    <!-- Gradiente Ambra (Colori della tua app) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D07A00"/>
    </linearGradient>
  </defs>

  <!-- Container Icona App (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)" stroke="#323846" stroke-width="4"/>

  <!-- Finestra GUI dell'app -->
  <rect x="80" y="100" width="352" height="312" rx="20" fill="#181A20" stroke="#2D3340" stroke-width="4"/>
  
  <!-- Pallini finestra GUI -->
  <circle cx="112" cy="128" r="6" fill="#E25C5C"/>
  <circle cx="132" cy="128" r="6" fill="#E2B15C"/>
  <circle cx="152" cy="128" r="6" fill="#5CE288"/>
  <line x1="80" y1="152" x2="432" y2="152" stroke="#2D3340" stroke-width="2"/>

  <!-- TRASFORMAZIONE: ONDA SONORA -> FRECCIA -> TESTO -->

  <!-- 1. ONDA SONORA (A Sinistra) -->
  <g transform="translate(110, 200)">
    <rect x="0" y="30" width="12" height="60" rx="6" fill="url(#amberGrad)"/>
    <rect x="22" y="10" width="12" height="100" rx="6" fill="url(#amberGrad)"/>
    <rect x="44" y="40" width="12" height="40" rx="6" fill="url(#amberGrad)"/>
    <rect x="66" y="0" width="12" height="120" rx="6" fill="url(#amberGrad)"/>
  </g>

  <!-- 2. FRECCIA DI CONVERSIONE (Al Centro) -->
  <g transform="translate(222, 248)">
    <path d="M 0 12 L 26 12 M 16 2 L 26 12 L 16 22" stroke="#F5A623" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- 3. RIGHE DI TESTO / SOTTOTITOLI (A Destra) -->
  <g transform="translate(275, 212)">
    <!-- Riga Testo 1 -->
    <rect x="0" y="0" width="125" height="14" rx="7" fill="#FFFFFF"/>
    <!-- Riga Testo 2 -->
    <rect x="0" y="28" width="95" height="14" rx="7" fill="#E2E8F0" opacity="0.8"/>
    <!-- Riga Testo 3 (Evidenziata in ambra) -->
    <rect x="0" y="56" width="130" height="14" rx="7" fill="url(#amberGrad)"/>
    <!-- Riga Testo 4 -->
    <rect x="0" y="84" width="80" height="14" rx="7" fill="#E2E8F0" opacity="0.5"/>
  </g>
</svg>