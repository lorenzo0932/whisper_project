name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libvulkan-dev

      - name: Build whisper.cpp (Vulkan)
        run: |
          cmake -B build -DGGML_VULKAN=ON
          cmake --build build -j
          cp build/bin/whisper-cli bin/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install nuitka PyQt6 yt-dlp platformdirs

      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --onefile \
            --enable-plugin=pyqt6 \
            --include-data-dir=bin=bin \
            --include-data-dir=media=media \
            --jobs=$(nproc) \
            --output-filename=WhisperGUI-x86_64.AppImage \
            main.py

      - name: Create installer
        run: |
          mkdir -p installer/linux/output
          cp dist/WhisperGUI-x86_64.AppImage installer/linux/output/
          chmod +x installer/linux/output/WhisperGUI-x86_64.AppImage

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/linux/output/WhisperGUI-x86_64.AppImage

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build whisper.cpp (Metal + CoreML)
        run: |
          cmake -B build -DGGML_METAL=ON -DWHISPER_COREML=ON
          cmake --build build -j
          cp build/bin/whisper-cli bin/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install nuitka PyQt6 yt-dlp platformdirs

      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --onefile \
            --enable-plugin=pyqt6 \
            --include-data-dir=bin=bin \
            --include-data-dir=media=media \
            --jobs=$(sysctl -n hw.logicalcpu) \
            --output-filename=WhisperGUI-macOS \
            main.py

      - name: Create .app bundle
        run: |
          APP_NAME="WhisperGUI"
          mkdir -p "dist/$APP_NAME.app/Contents/MacOS"
          mkdir -p "dist/$APP_NAME.app/Contents/Resources"
          cp "dist/WhisperGUI-macOS" "dist/$APP_NAME.app/Contents/MacOS/$APP_NAME"

          cat > "dist/$APP_NAME.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.whispergui.app</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundleShortVersionString</key>
              <string>${GITHUB_REF_NAME#v}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

      - name: Create .dmg
        run: |
          mkdir -p installer/macos/output
          hdiutil create -volname "WhisperGUI" \
            -srcfolder "dist/WhisperGUI.app" \
            -ov -format UDZO \
            "installer/macos/output/WhisperGUI-macOS-universal.dmg"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/macos/output/WhisperGUI-macOS-universal.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build whisper.cpp (Vulkan)
        run: |
          cmake -B build -DGGML_VULKAN=ON
          cmake --build build --config Release -j
          copy build\bin\Release\whisper-cli.exe bin\

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install nuitka PyQt6 yt-dlp platformdirs

      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --onefile `
            --enable-plugin=pyqt6 `
            --include-data-dir=bin=bin `
            --include-data-dir=media=media `
            --output-filename=WhisperGUI-x86_64.exe `
            main.py

      - name: Create installer
        run: |
          mkdir installer\windows\output
          copy dist\WhisperGUI-x86_64.exe installer\windows\output\

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/output/WhisperGUI-x86_64.exe
