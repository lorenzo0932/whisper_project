name: Build & Release

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS da buildare'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
  push:
    tags: ['v*']

jobs:
  build-linux:
    if: |
      github.event_name == 'push' ||
      inputs.os == 'all' ||
      inputs.os == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor | sudo tee /usr/share/keyrings/lunarg.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan jammy main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libvulkan-dev shaderc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bootstrap
        run: python3 build.py bootstrap

      - name: Build whisper.cpp (Vulkan) + ffmpeg
        run: python3 build.py build-engine

      - name: Build executable (PyInstaller onedir)
        run: python3 build.py build

      - name: Package AppImage
        run: python3 build.py package

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/linux/output/WhisperGUI-x86_64.AppImage

  build-macos:
    if: |
      github.event_name == 'push' ||
      inputs.os == 'all' ||
      inputs.os == 'macos'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bootstrap
        run: python3 build.py bootstrap

      - name: Build whisper.cpp (Metal + CoreML) + ffmpeg arm64
        run: python3 build.py build-engine

      - name: Build executable (PyInstaller onedir)
        run: python3 build.py build

      - name: Package .app + DMG
        run: python3 build.py package

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/macos/output/WhisperGUI-macOS-arm64.dmg

  build-windows:
    if: |
      github.event_name == 'push' ||
      inputs.os == 'all' ||
      inputs.os == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Vulkan SDK (glslc)
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK non installato' }
          echo "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Bootstrap
        shell: pwsh
        run: python build.py bootstrap

      - name: Build whisper.cpp (Vulkan) + ffmpeg
        shell: pwsh
        run: python build.py build-engine

      - name: Build executable (PyInstaller onedir)
        shell: pwsh
        run: python build.py build

      - name: Package NSIS installer
        shell: pwsh
        run: python build.py package

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/output/WhisperGUI-x86_64-setup.exe
