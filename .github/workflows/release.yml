name: Build & Release

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS da buildare'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    name: Fail-Fast Validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate Syntax (Python & Bash)
        run: |
          echo "Verifica sintassi Python (compileall)..."
          python -m compileall -q .
          echo "Verifica sintassi script Bash (se presenti)..."
          if [ -d "scripts" ]; then find scripts -name "*.sh" -exec bash -n {} +; fi

  build-linux:
    needs: validate
    if: github.event_name == 'push' || inputs.os == 'all' || inputs.os == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          # libgl1/libegl1/libglib2.0-0/libxkbcommon0/...: runtime Qt per packaging PyInstaller (icon_gen.py); file: richiesto da appimagetool
          # spirv-headers (jammy-updates) fornisce SPIRV-HeadersConfig.cmake richiesto da ggml-vulkan
          sudo apt-get install -y -qq cmake build-essential spirv-headers libgl1 libegl1 libglib2.0-0 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 file
          # Vulkan SDK 1.4.313 (deb LunarG): gli header 1.3.204 di jammy sono troppo vecchi per ggml-vulkan v1.9.1
          # (libvulkan-dev di Ubuntu dichiara Breaks su vulkan-headers: si sostituisce l'intero trio)
          wget -q https://packages.lunarg.com/vulkan/pool/main/v/vulkan-loader/libvulkan1_1.4.313.0~rc1-1lunarg22.04-1_amd64.deb -O /tmp/libvulkan1.deb
          wget -q https://packages.lunarg.com/vulkan/pool/main/v/vulkan-loader/libvulkan-dev_1.4.313.0~rc1-1lunarg22.04-1_amd64.deb -O /tmp/libvulkan-dev.deb
          wget -q https://packages.lunarg.com/vulkan/pool/main/v/vulkan-headers/vulkan-headers_1.4.313.0~rc1-1lunarg22.04-1_all.deb -O /tmp/vulkan-headers.deb
          wget -q https://packages.lunarg.com/vulkan/pool/main/s/shaderc/shaderc_2025.2~rc1-1lunarg22.04-1_amd64.deb -O /tmp/shaderc.deb
          sudo dpkg -i /tmp/libvulkan1.deb /tmp/libvulkan-dev.deb /tmp/vulkan-headers.deb /tmp/shaderc.deb

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Downloads (build/cache)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-linux-${{ hashFiles('build.py') }}

      - name: Cache Engine (bin)
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: bin
          key: engine-linux-${{ hashFiles('build.py') }}

      - name: Bootstrap
        run: python3 build.py bootstrap

      - name: Build whisper.cpp (Vulkan) + ffmpeg
        run: |
          if [ "${{ steps.cache-engine.outputs.cache-hit }}" = "true" ]; then
            python3 build.py build-engine --skip-engine
          else
            python3 build.py build-engine
          fi

      - name: Build executable (PyInstaller onedir)
        run: python3 build.py build

      - name: Package AppImage
        run: python3 build.py package

      - name: Upload Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/linux/output/WhisperGUI-x86_64.AppImage

  build-macos:
    needs: validate
    if: github.event_name == 'push' || inputs.os == 'all' || inputs.os == 'macos'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Downloads (build/cache)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-macos-${{ hashFiles('build.py') }}

      - name: Cache Engine (bin)
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: bin
          key: engine-macos-${{ hashFiles('build.py') }}

      - name: Bootstrap
        run: python3 build.py bootstrap

      - name: Build whisper.cpp (Metal + CoreML) + ffmpeg arm64
        run: |
          if [ "${{ steps.cache-engine.outputs.cache-hit }}" = "true" ]; then
            python3 build.py build-engine --skip-engine
          else
            python3 build.py build-engine
          fi

      - name: Build executable (PyInstaller onedir)
        run: python3 build.py build

      - name: Package .app + DMG
        run: python3 build.py package

      - name: Upload Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/macos/output/WhisperGUI-macOS-arm64.dmg

  build-windows:
    needs: validate
    if: github.event_name == 'push' || inputs.os == 'all' || inputs.os == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Cache Downloads (build/cache)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-windows-${{ hashFiles('build.py') }}

      - name: Cache Engine (bin)
        id: cache-engine
        uses: actions/cache@v4
        with:
          path: bin
          key: engine-windows-${{ hashFiles('build.py') }}

      - name: Install Vulkan SDK (glslc)
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK non installato' }
          echo "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Bootstrap
        shell: pwsh
        run: python build.py bootstrap

      - name: Build whisper.cpp (Vulkan) + ffmpeg
        shell: pwsh
        run: |
          if ('${{ steps.cache-engine.outputs.cache-hit }}' -eq 'true') {
            python build.py build-engine --skip-engine
          } else {
            python build.py build-engine
          }

      - name: Build executable (PyInstaller onedir)
        shell: pwsh
        run: python build.py build

      - name: Package NSIS installer
        shell: pwsh
        run: python build.py package

      - name: Upload Release Asset
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/output/WhisperGUI-x86_64-setup.exe
