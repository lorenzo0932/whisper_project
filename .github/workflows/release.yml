name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libvulkan-dev

      - name: Build whisper.cpp (Vulkan)
        run: |
          cmake -B build -DGGML_VULKAN=ON
          cmake --build build -j
          cp build/bin/whisper-cli bin/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller PyQt6 yt-dlp platformdirs

      - name: Build executable (PyInstaller)
        run: |
          pyinstaller --onefile \
            --add-data "bin:bin" \
            --add-data "media:media" \
            --paths . \
            --name WhisperGUI \
            main.py
          mv dist/WhisperGUI dist/WhisperGUI-x86_64.AppImage

      - name: Create installer
        run: |
          mkdir -p installer/linux/output
          cp dist/WhisperGUI-x86_64.AppImage installer/linux/output/
          chmod +x installer/linux/output/WhisperGUI-x86_64.AppImage

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/linux/output/WhisperGUI-x86_64.AppImage

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build whisper.cpp (Metal + CoreML)
        run: |
          cmake -B build -DGGML_METAL=ON -DWHISPER_COREML=ON
          cmake --build build -j
          cp build/bin/whisper-cli bin/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller PyQt6 yt-dlp platformdirs

      - name: Build executable (PyInstaller)
        run: |
          pyinstaller --onefile \
            --add-data "bin:bin" \
            --add-data "media:media" \
            --paths . \
            --name WhisperGUI \
            main.py
          mv dist/WhisperGUI dist/WhisperGUI-macOS

      - name: Create .dmg
        run: |
          mkdir -p installer/macos/output
          chmod +x dist/WhisperGUI-macOS
          hdiutil create -volname "WhisperGUI" \
            -srcfolder dist/WhisperGUI-macOS \
            -ov -format UDZO \
            "installer/macos/output/WhisperGUI-macOS-universal.dmg"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/macos/output/WhisperGUI-macOS-universal.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build whisper.cpp (Vulkan)
        run: |
          cmake -B build -DGGML_VULKAN=ON
          cmake --build build --config Release -j
          copy build\bin\Release\whisper-cli.exe bin\

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller PyQt6 yt-dlp platformdirs

      - name: Build executable (PyInstaller)
        run: |
          pyinstaller --onefile `
            --add-data "bin;bin" `
            --add-data "media;media" `
            --paths . `
            --name WhisperGUI `
            main.py
          move dist\WhisperGUI.exe dist\WhisperGUI-x86_64.exe

      - name: Create installer
        run: |
          mkdir installer\windows\output
          copy dist\WhisperGUI-x86_64.exe installer\windows\output\

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/output/WhisperGUI-x86_64.exe
