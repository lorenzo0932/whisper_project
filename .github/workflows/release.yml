name: Build & Release

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS da buildare'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
  push:
    tags: ['v*']

jobs:
  build-linux:
    if: |
      github.event_name == 'push' ||
      inputs.os == 'all' ||
      inputs.os == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libvulkan-dev

      - name: Build whisper.cpp (Vulkan)
        run: |
          cmake -B build -DGGML_VULKAN=ON
          cmake --build build -j
          mkdir -p bin
          cp build/bin/whisper-cli bin/

      - name: Download static ffmpeg
        run: |
          mkdir -p bin
          curl -sL "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz?accept=yes" -o /tmp/ffmpeg.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/
          cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe bin/
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller PyQt6 yt-dlp platformdirs cairosvg pillow

      - name: Build executable (PyInstaller onedir)
        run: |
          pyinstaller --onedir \
            --add-data "bin:bin" \
            --add-data "media:media" \
            --add-data "icon:icon" \
            --paths . \
            --name WhisperGUI \
            main.py
          python3 -c "
          import cairosvg
          cairosvg.svg2png(url='icon/ai_studio_code.svg', write_to='/tmp/whisper-gui.png', output_width=256, output_height=256)
          "

      - name: Package AppImage
        run: |
          mkdir -p AppDir
          cp -r dist/WhisperGUI/. AppDir/
          cp /tmp/whisper-gui.png AppDir/whisper-gui.png
          printf '#!/bin/bash\nexec "\$APPDIR/WhisperGUI" "\$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          cat > AppDir/whisper-gui.desktop <<'EOF'
[Desktop Entry]
Version=1.0
Type=Application
Name=WhisperGUI
Comment=Trascrizione AI nativa (Vulkan)
Exec=WhisperGUI
Icon=whisper-gui
StartupWMClass=whisper-gui
Terminal=false
Categories=AudioVideo;Audio;
EOF
          curl -sL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp
          ./appimagetool --appimage-extract-and-run "$GITHUB_WORKSPACE/AppDir" "$GITHUB_WORKSPACE/WhisperGUI-x86_64.AppImage"

      - name: Create installer
        run: |
          mkdir -p installer/linux/output
          cp WhisperGUI-x86_64.AppImage installer/linux/output/
          chmod +x installer/linux/output/WhisperGUI-x86_64.AppImage

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/linux/output/WhisperGUI-x86_64.AppImage

  build-macos:
    if: |
      github.event_name == 'push' ||
      inputs.os == 'all' ||
      inputs.os == 'macos'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build whisper.cpp (Metal + CoreML)
        run: |
          cmake -B build -DGGML_METAL=ON -DWHISPER_COREML=ON
          cmake --build build -j
          mkdir -p bin
          cp build/bin/whisper-cli bin/

      - name: Download static ffmpeg
        run: |
          mkdir -p bin
          curl -sL "https://evermeet.cx/ffmpeg/get/ffmpeg/zip" -o /tmp/ffmpeg.zip
          curl -sL "https://evermeet.cx/ffmpeg/get/ffprobe/zip" -o /tmp/ffprobe.zip
          unzip -o /tmp/ffmpeg.zip -d bin/
          unzip -o /tmp/ffprobe.zip -d bin/
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller PyQt6 yt-dlp platformdirs

      - name: Build executable (PyInstaller)
        run: |
          pyinstaller --onefile \
            --add-data "bin:bin" \
            --add-data "media:media" \
            --add-data "icon:icon" \
            --paths . \
            --name WhisperGUI \
            main.py

      - name: Create .app bundle
        run: |
          mkdir -p "WhisperGUI.app/Contents/MacOS" "WhisperGUI.app/Contents/Resources"
          cp dist/WhisperGUI "WhisperGUI.app/Contents/MacOS/WhisperGUI"

          python3 -m pip install cairosvg Pillow --quiet

          python3 -c "
          import cairosvg, os
          from PIL import Image
          cairosvg.svg2png(url='icon/ai_studio_code.svg', write_to='/tmp/icon_large.png', output_width=1024, output_height=1024)
          os.makedirs('/tmp/icon.iconset', exist_ok=True)
          img = Image.open('/tmp/icon_large.png')
          for px, label in [(16,'16'),(32,'32'),(64,'64'),(128,'128'),(256,'256'),(512,'512')]:
              img.resize((px, px), Image.LANCZOS).save('/tmp/icon.iconset/icon_'+label+'x'+label+'.png')
              img.resize((px*2, px*2), Image.LANCZOS).save('/tmp/icon.iconset/icon_'+label+'x'+label+'@2x.png')
          "
          iconutil -c icns /tmp/icon.iconset -o "WhisperGUI.app/Contents/Resources/icon.icns"

          python3 -c "
          import textwrap, os
          plist = textwrap.dedent('''\\
              <?xml version=\"1.0\" encoding=\"UTF-8\"?>
              <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
              <plist version=\"1.0\">
              <dict>
                <key>CFBundleExecutable</key>
                <string>WhisperGUI</string>
                <key>CFBundleIdentifier</key>
                <string>com.whisper.gui</string>
                <key>CFBundleName</key>
                <string>WhisperGUI</string>
                <key>CFBundleIconFile</key>
                <string>icon.icns</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0.0</string>
                <key>LSMinimumSystemVersion</key>
                <string>12.0</string>
              </dict>
              </plist>''')
          with open('WhisperGUI.app/Contents/Info.plist', 'w') as f:
              f.write(plist)
          "

      - name: Create .dmg
        run: |
          mkdir -p installer/macos/output
          hdiutil create -volname "WhisperGUI" \
            -srcfolder WhisperGUI.app \
            -ov -format UDZO \
            "installer/macos/output/WhisperGUI-macOS-universal.dmg"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/macos/output/WhisperGUI-macOS-universal.dmg

  build-windows:
    if: |
      github.event_name == 'push' ||
      inputs.os == 'all' ||
      inputs.os == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build whisper.cpp (Vulkan)
        run: |
          if not exist bin mkdir bin
          cmake -B build -DGGML_VULKAN=ON
          cmake --build build --config Release -j
          copy build\bin\Release\whisper-cli.exe bin\

      - name: Download static ffmpeg
        shell: pwsh
        run: |
          mkdir -Force bin
          curl -sL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip" -o $env:TEMP\ffmpeg.zip
          Expand-Archive -Path $env:TEMP\ffmpeg.zip -DestinationPath $env:TEMP\ffmpeg
          $dir = Get-ChildItem $env:TEMP\ffmpeg -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" bin\
          Copy-Item "$($dir.FullName)\bin\ffprobe.exe" bin\

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller PyQt6 yt-dlp platformdirs

      - name: Build executable (PyInstaller)
        run: |
          pyinstaller --onefile `
            --add-data "bin;bin" `
            --add-data "media;media" `
            --add-data "icon;icon" `
            --paths . `
            --name WhisperGUI main.py
          move dist\WhisperGUI.exe dist\WhisperGUI-x86_64.exe

      - name: Create installer
        run: |
          mkdir installer\windows\output
          copy dist\WhisperGUI-x86_64.exe installer\windows\output\

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: installer/windows/output/WhisperGUI-x86_64.exe
